[project]
name = "comptext-gemini-mcp"
version = "1.0.0"
description = "Google Gemini MCP server for Antigravity CLI (agy-ct) — HIGH thinking budget"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "google-genai>=1.0.0",
]

[project.scripts]
comptext-gemini-mcp = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["server.py"]
