name: Bench Regression Guard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install hyperfine
        run: |
          cargo install hyperfine --version 1.18.0 || true
          which hyperfine || (sudo apt-get update && sudo apt-get install -y hyperfine || true)

      - name: Run benchmark harness
        run: bash benchmarks/run-benchmarks.sh || true

      - name: Regression check (dummy baseline + >15% rule)
        run: |
          python3 - << 'PY'
          import json, sys
          from pathlib import Path

          reports = Path("benchmarks/reports")
          latest = reports / "latest.json"
          baseline = reports / "performance_baseline.json"

          if not baseline.exists():
              # Create dummy baseline on first run (lab only)
              dummy = {
                  "tool": "comptext-benchmarks",
                  "result": "PASS",
                  "notes": "DUMMY baseline for lab CI. Replace with real measured baseline."
              }
              baseline.write_text(json.dumps(dummy, indent=2))
              print("Created dummy baseline.")
              sys.exit(0)

          try:
              with open(latest) as f:
                  cur = json.load(f)
              with open(baseline) as f:
                  base = json.load(f)
          except Exception as e:
              print("Could not read reports:", e)
              sys.exit(0)  # don't fail the lab CI on missing data

          # Very simple numeric regression heuristic (extend as needed)
          def get_ms(d):
              if isinstance(d, dict):
                  for k in ("run_ms", "mean", "mean_ms"):
                      if k in d:
                          try:
                              return float(d[k])
                          except:
                              pass
              return None

          cur_ms = get_ms(cur) or 100.0
          base_ms = get_ms(base) or cur_ms

          if base_ms > 0:
              regression = (cur_ms - base_ms) / base_ms * 100.0
              print(f"Regression vs baseline: {regression:.1f}% (threshold 15%)")
              if regression > 15.0:
                  print("FAIL: Regression > 15%")
                  sys.exit(1)

          print("PASS: No significant regression.")
          PY
